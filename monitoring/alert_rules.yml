groups:
  - name: books_api
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: process_cpu_usage > 0.8
        for: 5m
        annotations:
          summary: "High CPU usage detected"
          description: "Books API CPU usage is {{ $value | humanizePercentage }}"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 500
        for: 5m
        annotations:
          summary: "High memory usage detected"
          description: "Books API memory usage is {{ $value | humanize }}MB"

      - alert: ApplicationDown
        expr: up{job="books-api"} == 0
        for: 1m
        annotations:
          summary: "Books API is down"
          description: "Books API instance is not responding"

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 5m
        annotations:
          summary: "High HTTP error rate"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: SlowRequests
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 1
        for: 5m
        annotations:
          summary: "High request latency detected"
          description: "95th percentile response time is {{ $value }}s"
