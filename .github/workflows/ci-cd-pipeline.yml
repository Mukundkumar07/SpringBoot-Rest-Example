name: CI/CD Pipeline - Build & Deploy to Kubernetes

on:
  push:
    branches:
      - SpringBoot-Rest-Complete
      - main
      - develop
  pull_request:
    branches:
      - SpringBoot-Rest-Complete
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_IMAGE: books-api
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.11'

jobs:
  # ============================================================================
  # STAGE 1: BUILD & TEST
  # ============================================================================
  build:
    name: Build & Test Application
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Display Java Version
        run: java -version

      - name: Build with Maven
        run: mvn -B clean package -DskipTests
        
      - name: Run Unit Tests
        run: mvn -B test

      - name: Generate Test Report
        if: always()
        run: |
          echo "Test Report Generated"
          ls -la target/surefire-reports/ || echo "No test reports found"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: target/*.jar
          retention-days: 5

  # ============================================================================
  # STAGE 2: BUILD DOCKER IMAGE
  # ============================================================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Image Summary
        run: |
          echo "Docker image successfully built and pushed"
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Repository: ${{ env.IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ============================================================================
  # STAGE 3: SECURITY SCANNING
  # ============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # STAGE 4: DEPLOY TO STAGING (Kubernetes)
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging Kubernetes
    runs-on: ubuntu-latest
    needs: [build-docker, security-scan]
    if: github.ref == 'refs/heads/SpringBoot-Rest-Complete' && github.event_name == 'push'
    
    environment:
      name: staging
      url: https://staging-books-api.example.com
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

      - name: Deploy to Staging
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/staging/ -n books-staging
          kubectl rollout status deployment/books-api -n books-staging --timeout=5m

      - name: Verify Deployment
        run: |
          kubectl get pods -n books-staging
          kubectl get services -n books-staging
          kubectl describe deployment books-api -n books-staging

      - name: Run Health Check
        run: |
          sleep 10
          STAGING_URL=$(kubectl get svc -n books-staging books-api-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "Staging URL: $STAGING_URL"
          curl -f http://$STAGING_URL:8080/actuator/health || echo "Health check endpoint not ready yet"

  # ============================================================================
  # STAGE 5: INTEGRATION TESTS
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/SpringBoot-Rest-Complete' && github.event_name == 'push'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run Integration Tests
        run: mvn -B verify
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/failsafe-reports/
          retention-days: 5

  # ============================================================================
  # STAGE 6: DEPLOY TO PRODUCTION (Kubernetes)
  # ============================================================================
  deploy-production:
    name: Deploy to Production Kubernetes
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/SpringBoot-Rest-Complete' && github.event_name == 'push'
    
    environment:
      name: production
      url: https://books-api.example.com
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl for Production
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

      - name: Deploy to Production
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/production/ -n books-production
          kubectl rollout status deployment/books-api -n books-production --timeout=5m

      - name: Verify Production Deployment
        run: |
          kubectl get pods -n books-production
          kubectl get services -n books-production
          kubectl describe deployment books-api -n books-production

      - name: Production Health Check
        run: |
          sleep 15
          PROD_URL=$(kubectl get svc -n books-production books-api-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "Production URL: $PROD_URL"
          curl -f http://$PROD_URL:8080/actuator/health || echo "Health check in progress"

  # ============================================================================
  # STAGE 7: NOTIFICATIONS & REPORTING
  # ============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build, build-docker, deploy-production]
    if: always()
    
    steps:
      - name: Prepare Summary
        run: |
          echo "# CI/CD Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker: ${{ needs.build-docker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment: ${{ needs.deploy-production.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Registry: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY

      - name: Slack Notification (Success)
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ CI/CD Pipeline Completed Successfully",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Books API - CI/CD Success* 🎉\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }

      - name: Slack Notification (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ CI/CD Pipeline Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Books API - CI/CD Failed* ⚠️\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }
