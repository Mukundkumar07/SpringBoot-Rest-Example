# ============================================================================
# STAGING DEPLOYMENT - Books API
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-api
  namespace: books-staging
  labels:
    app: books-api
    environment: staging
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: books-api
      environment: staging
  template:
    metadata:
      labels:
        app: books-api
        environment: staging
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: books-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: books-api
        image: ghcr.io/mukundkumar07/springboot-rest-example:SpringBoot-Rest-Complete
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "staging"
        - name: SERVER_PORT
          value: "8080"
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "health,info,metrics,prometheus"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}

---
# ============================================================================
# SERVICE - Books API (Staging)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: books-api-service
  namespace: books-staging
  labels:
    app: books-api
    environment: staging
spec:
  type: LoadBalancer
  selector:
    app: books-api
    environment: staging
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  sessionAffinity: None

---
# ============================================================================
# HORIZONTAL POD AUTOSCALER (HPA) - Staging
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: books-api-hpa
  namespace: books-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: books-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

---
# ============================================================================
# SERVICE ACCOUNT & RBAC
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: books-api-sa
  namespace: books-staging

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: books-api-role
  namespace: books-staging
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: books-api-rolebinding
  namespace: books-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: books-api-role
subjects:
- kind: ServiceAccount
  name: books-api-sa
  namespace: books-staging

---
# ============================================================================
# CONFIGMAP - Application Configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: books-api-config
  namespace: books-staging
data:
  application.properties: |
    spring.application.name=books-api
    spring.profiles.active=staging
    server.port=8080
    server.servlet.context-path=/
    
    # Actuator
    management.endpoints.web.exposure.include=health,info,metrics,prometheus
    management.endpoint.health.show-details=always
    management.metrics.enable.jvm=true
    management.metrics.enable.process=true
    management.metrics.enable.system=true
    
    # Logging
    logging.level.root=INFO
    logging.level.com.love2code.books=DEBUG

---
# ============================================================================
# NETWORKPOLICY - Security
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: books-api-netpolicy
  namespace: books-staging
spec:
  podSelector:
    matchLabels:
      app: books-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector: {}
