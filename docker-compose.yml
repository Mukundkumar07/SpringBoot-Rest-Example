version: '3.9'

services:
  # ============================================================================
  # BOOKS API - Spring Boot Application
  # ============================================================================
  books-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: books-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - books-network
    restart: unless-stopped
    labels:
      - "app=books-api"
      - "version=1.0.0"

  # ============================================================================
  # POSTGRESQL DATABASE (Optional - if needed)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: books-db
    environment:
      POSTGRES_DB: books_db
      POSTGRES_USER: books_user
      POSTGRES_PASSWORD: books_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - books-network
    restart: unless-stopped

  # ============================================================================
  # PROMETHEUS - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: books-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - books-network
    restart: unless-stopped
    depends_on:
      - books-api

  # ============================================================================
  # GRAFANA - Visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: books-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - books-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # ============================================================================
  # JAEGER - Distributed Tracing (Optional)
  # ============================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: books-jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: "9411"
    networks:
      - books-network
    restart: unless-stopped

  # ============================================================================
  # NGINX - Reverse Proxy (Load Balancer)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: books-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - books-network
    restart: unless-stopped
    depends_on:
      - books-api

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  books-network:
    driver: bridge
